<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Message Sent</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
        }

        .success-box {
            background: white;
            padding: 40px;

            width: 350px;

            text-align: center;

            border-radius: 12px;

            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .success-icon {
            font-size: 50px;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #666;
        }

        a {
            display: inline-block;

            margin-top: 20px;

            padding: 10px 18px;

            background: #007bff;
            color: white;

            text-decoration: none;

            border-radius: 6px;
        }

        a:hover {
            background: #0056b3;
        }
    </style>
</head>

<body>

    <div class="success-box">

        <div class="success-icon">
            ✅
        </div>

        <h1>Message Sent!</h1>

        <p>
            Thank you for contacting us.
            We will get back to you soon.
        </p>

        <a href="/">
            Back to Home
        </a>

    </div>

</body>
</html>
