<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #1f1f1f;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
        }

        .login-box {
            width: 350px;
            padding: 30px;

            background: #2b2b2b;
            border-radius: 12px;

            box-shadow: 0 0 20px rgba(0,0,0,0.4);
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 25px;
        }

        label {
            color: white;
            display: block;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            box-sizing: border-box;

            padding: 12px;
            margin-bottom: 18px;

            border: 1px solid #555;
            border-radius: 6px;

            background: #1f1f1f;
            color: white;
        }

        button {
            width: 100%;
            padding: 12px;

            border: none;
            border-radius: 6px;

            background: #007bff;
            color: white;

            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .google-btn {
    display: block;
    width: 100%;
    padding: 12px;
    margin-top: 15px;

    text-align: center;
    text-decoration: none;

    background: white;
    color: #222;

    border-radius: 8px;
    font-weight: 600;

    box-sizing: border-box;
}
    </style>
</head>

<body>

    <div class="login-box">

        <h1>Admin Login</h1>

        <form method="POST">

            <label>Username</label>

            <input
                type="text"
                name="username"
                placeholder="Enter username"
                required
            >

            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >

            <button type="submit">
                Login
            </button>

            <a href="/google/login" class="google-btn">
    Continue with Google
</a>

        </form>

    </div>

</body>
</html>
